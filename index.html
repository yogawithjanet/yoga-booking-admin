<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>團課預約系統｜後台管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --ink:#26251f;
    --sage:#5f7a5a;
    --sage-light:#eaf0e6;
    --sage-dark:#3f5a3c;
    --clay:#c98a5e;
    --clay-light:#f7e9dd;
    --paper:#f7f6f2;
    --card:#ffffff;
    --line:#e6e3da;
    --muted:#8c8878;
    --danger:#c1503a;
    --danger-light:#f7e2dc;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);}
  #app{display:flex;min-height:100vh;}

  /* ---- Sidebar ---- */
  .sidebar{
    width:220px;flex-shrink:0;background:var(--sage-dark);color:#fff;
    padding:22px 0;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{padding:0 22px 22px;font-weight:800;font-size:16px;letter-spacing:.5px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
  .brand span{display:block;font-weight:400;font-size:11.5px;opacity:.65;margin-top:3px;letter-spacing:1px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:11px 22px;font-size:13.5px;font-weight:500;
    color:rgba(255,255,255,.75);cursor:pointer;border-left:3px solid transparent;
  }
  .nav-item .ic{width:18px;text-align:center;}
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:rgba(255,255,255,.1);color:#fff;border-left-color:var(--clay);}

  /* ---- Main ---- */
  .main{flex:1;padding:30px 36px;max-width:1220px;}
  .page-title{font-size:20px;font-weight:800;margin:0 0 4px;}
  .page-sub{font-size:13px;color:var(--muted);margin:0 0 24px;line-height:1.6;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden;}
  .panel-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 18px;border-bottom:1px solid var(--line);
  }
  .panel-head h3{margin:0;font-size:14.5px;font-weight:700;}
  .panel-body{padding:16px 18px;}
  .panel-body.pad0{padding:0;}

  .btn{
    border:none;border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:700;
    cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  }
  .btn-primary{background:var(--sage);color:#fff;}
  .btn-primary:hover{background:var(--sage-dark);}
  .btn-ghost{background:var(--sage-light);color:var(--sage-dark);}
  .btn-danger{background:var(--danger-light);color:var(--danger);}
  .btn-sm{padding:5px 10px;font-size:11.5px;border-radius:7px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-size:11px;color:var(--muted);letter-spacing:.5px;
    padding:9px 18px;background:var(--paper);border-bottom:1px solid var(--line);font-weight:700;
  }
  tbody td{padding:11px 18px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .tag.on{background:var(--sage-light);color:var(--sage-dark);}
  .tag.off{background:#f1efe8;color:var(--muted);}
  .tag.warn{background:#fdf1d0;color:#8a6a1f;}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .avatar-sm{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--sage),var(--clay));display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;margin-right:8px;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid.full{grid-template-columns:1fr;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;color:var(--muted);font-weight:600;}
  .field input, .field select, .field textarea{
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;
    font-size:13px;font-family:inherit;background:var(--paper);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .weekday-picker{display:flex;gap:6px;flex-wrap:wrap;}
  .wd-chip{
    padding:7px 0;width:38px;text-align:center;border-radius:8px;font-size:12px;
    background:var(--paper);border:1px solid var(--line);cursor:pointer;color:var(--muted);font-weight:600;
  }
  .wd-chip.on{background:var(--sage);color:#fff;border-color:var(--sage);}

  .add-bar{display:flex;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:var(--paper);}

  /* ---- 學員管理頁：三欄快速操作卡片 ---- */
  .action-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch;margin-bottom:18px;}
  .action-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;flex-direction:column;}
  .action-card h3{font-size:16px;font-weight:700;margin:0 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line);}
  .action-card .desc{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.6;}
  .action-field{margin-bottom:16px;}
  .action-field label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:7px;}
  .action-field input, .action-field select, .action-field textarea{
    width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 15px;
    font-size:13.5px;font-family:inherit;background:var(--paper);color:var(--ink);
  }
  .action-btn-full{
    width:100%;border:none;border-radius:26px;padding:14px;font-size:14px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:auto;
  }
  .action-btn-full.primary{background:var(--sage);color:#fff;}
  .action-btn-full.primary:hover{background:var(--sage-dark);}
  .action-btn-secondary-full{
    width:100%;border:none;border-radius:22px;padding:11px;font-size:12.5px;font-weight:600;
    cursor:pointer;background:var(--sage-light);color:var(--sage-dark);margin-bottom:16px;
  }
  .tag-add-row{display:flex;gap:8px;margin-bottom:18px;}
  .tag-add-row input{flex:1;min-width:0;}
  .tag-add-btn{
    width:46px;flex-shrink:0;border:none;border-radius:13px;background:var(--sage);color:#fff;
    font-size:18px;cursor:pointer;
  }
  .tag-add-btn:hover{background:var(--sage-dark);}
  .tag-chip-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px;}
  .tag-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--sage-light);color:var(--sage-dark);
    padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;
  }
  .tag-chip .x{cursor:pointer;font-weight:700;opacity:.7;}
  .tag-chip .x:hover{opacity:1;}
  .date-row-full{display:flex;gap:8px;margin-bottom:8px;}
  .date-row-full input{flex:1;min-width:0;}

  .toggle{
    position:relative;width:38px;height:22px;background:#e0ddd1;border-radius:20px;cursor:pointer;flex-shrink:0;
  }
  .toggle.on{background:var(--sage);}
  .toggle .knob{
    position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;
    transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2);
  }
  .toggle.on .knob{left:18px;}

  /* ---- 報名表單設定：問題列表 ---- */
  .q-row{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);}
  .q-row:last-child{border-bottom:none;}
  .q-order{display:flex;flex-direction:column;gap:2px;}
  .q-order button{border:none;background:var(--sage-light);color:var(--sage-dark);width:22px;height:18px;border-radius:5px;cursor:pointer;font-size:10px;line-height:1;}
  .q-order button:disabled{opacity:.3;cursor:not-allowed;}
  .q-main{flex:1;min-width:0;}
  .q-text{font-size:13.5px;font-weight:700;}
  .q-meta{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .q-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}

  .settings-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);gap:16px;}
  .settings-row:last-child{border-bottom:none;}
  .settings-row .label{font-size:13.5px;font-weight:600;}
  .settings-row .desc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5;}

  .msg-template{
    background:var(--paper);border:1px dashed var(--line);border-radius:10px;
    padding:12px 14px;font-size:12.5px;color:var(--ink);line-height:1.7;white-space:pre-wrap;
  }
  .var-tag{display:inline-block;background:var(--clay-light);color:#8a5a35;padding:1px 6px;border-radius:5px;font-size:11px;font-family:monospace;}

  .stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .stat-card .num{font-size:22px;font-weight:800;color:var(--sage-dark);}
  .stat-card .lbl{font-size:11.5px;color:var(--muted);margin-top:2px;}

  .hint-box{
    display:flex;gap:9px;background:var(--clay-light);border:1px solid #eeceb6;
    border-radius:10px;padding:10px 13px;font-size:12px;color:#8a5a35;line-height:1.6;margin-bottom:18px;
  }

  /* ---- 課程日曆 ---- */
  .mini-calendar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .mc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .mc-month-label{font-weight:700;font-size:16px;}
  .mc-nav{border:none;background:var(--sage-light);color:var(--sage-dark);width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer;}
  .mc-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .mc-cell{
    min-height:88px;display:flex;flex-direction:column;align-items:stretch;
    border-radius:9px;cursor:pointer;font-size:12px;color:var(--ink);
    border:1px solid transparent;padding:4px;
  }
  .mc-cell:not(.empty):hover{background:var(--paper);}
  .mc-cell.empty{cursor:default;}
  .mc-cell.past{color:#c2beb2;}
  .mc-cell.past .mc-event{opacity:.55;}
  .mc-daynum{font-size:12px;font-weight:600;margin-bottom:2px;}
  .mc-events{display:flex;flex-direction:column;gap:2px;overflow:hidden;}
  .mc-event{
    background:var(--sage-light);color:var(--sage-dark);border-radius:5px;
    padding:2px 5px;font-size:10.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .mc-event.extra{background:var(--clay-light);color:#8a5a35;}
  .mc-more{font-size:10px;color:var(--muted);padding:1px 5px;}
  .mc-cell.selected{background:var(--sage-light);border-color:var(--sage);}
  .mc-cell.today .mc-daynum{
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--sage);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;
  }

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;
    opacity:0;transition:all .3s ease;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- 登入畫面 ---- */
  #loginScreen{
    position:fixed;inset:0;background:var(--sage-dark);
    display:flex;align-items:center;justify-content:center;z-index:100;
  }
  .login-box{
    background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:320px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
  }
  .login-box .lock-ic{font-size:26px;margin-bottom:6px;}
  .login-box h2{margin:0 0 4px;font-size:18px;}
  .login-box p{margin:0 0 20px;font-size:12.5px;color:var(--muted);line-height:1.6;}
  .login-box input{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    font-size:14px;font-family:inherit;margin-bottom:10px;background:var(--paper);color:var(--ink);
  }
  .login-box .btn-primary{width:100%;justify-content:center;padding:11px;font-size:13.5px;border-radius:10px;}
  .login-err{color:var(--danger);font-size:12px;margin:-4px 0 10px;min-height:14px;}
  .sidebar-bottom{margin-top:auto;padding:14px 22px 0;border-top:1px solid rgba(255,255,255,.12);}
  .logout-link{color:rgba(255,255,255,.65);font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .logout-link:hover{color:#fff;}
</style>
</head>
<body>
<div id="bootLoading" style="position:fixed;inset:0;background:var(--sage-dark);display:flex;align-items:center;justify-content:center;z-index:200;">
  <div style="width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:bootspin .8s linear infinite;"></div>
</div>
<style>@keyframes bootspin{to{transform:rotate(360deg);}}</style>

<div id="loginScreen" style="display:none;">
  <div class="login-box" id="loginBox">
    <div class="lock-ic">🔒</div>
    <h2>後台管理登入</h2>
    <p>此頁面僅供店家／管理員使用，請輸入管理密碼。</p>
    <input type="password" id="loginPassword" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter') tryLogin()">
    <div class="login-err" id="loginErr"></div>
    <button class="btn btn-primary" onclick="tryLogin()">登入</button>
    <div style="text-align:center;margin-top:12px;">
      <span style="font-size:12.5px;color:var(--muted);cursor:pointer;text-decoration:underline;" onclick="showForgotBox()">忘記密碼？</span>
    </div>
  </div>

  <div class="login-box" id="forgotBox" style="display:none;">
    <div class="lock-ic">🔑</div>
    <h2>重設密碼</h2>
    <div id="forgotStep1">
      <p id="securityQuestionText">安全問題載入中...</p>
      <input type="text" id="securityAnswerInput" placeholder="請輸入答案">
      <div class="login-err" id="forgotErr1"></div>
      <button class="btn btn-primary" onclick="verifySecurityAnswer()">驗證答案</button>
    </div>
    <div id="forgotStep2" style="display:none;">
      <p>驗證成功，請設定新密碼。</p>
      <input type="password" id="newPwInput" placeholder="新密碼（至少 6 碼）">
      <input type="password" id="newPwInput2" placeholder="再次輸入新密碼">
      <div class="login-err" id="forgotErr2"></div>
      <button class="btn btn-primary" onclick="resetPasswordViaForgot()">確認重設</button>
    </div>
    <div style="text-align:center;margin-top:12px;">
      <span style="font-size:12.5px;color:var(--muted);cursor:pointer;text-decoration:underline;" onclick="showLoginBox()">返回登入</span>
    </div>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="sidebar">
    <div class="brand" id="sidebarBrand">團課教室<span>後台管理系統</span></div>
    <div class="nav-item active" data-page="overview"><span class="ic">📊</span>總覽</div>
    <div class="nav-item" data-page="store"><span class="ic">🏠</span>店家設定</div>
    <div class="nav-item" data-page="cashflow"><span class="ic">💰</span>金流管理</div>
    <div class="nav-item" data-page="classes"><span class="ic">🗓️</span>課程設定</div>
    <div class="nav-item" data-page="roster"><span class="ic">📋</span>每日名單</div>
    <div class="nav-item" data-page="registration"><span class="ic">📝</span>報名表單設定</div>
    <div class="nav-item" data-page="members"><span class="ic">👥</span>學員管理</div>
    <div class="nav-item" data-page="teachers"><span class="ic">🧑‍🏫</span>老師管理</div>
    <div class="nav-item" data-page="teacherlog"><span class="ic">📈</span>老師教學紀錄</div>
    <div class="nav-item" data-page="popularity"><span class="ic">🔥</span>課程熱門度</div>
    <div class="sidebar-bottom"><span class="logout-link" onclick="logout()">🚪 登出</span></div>
  </div>

  <div class="main" id="mainArea"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ Supabase 連線設定（跟前台用同一組，實際數值放在 config.js，不進版控） ============ */
const SUPABASE_URL = window.APP_CONFIG.SUPABASE_URL;
const SUPABASE_ANON_KEY = window.APP_CONFIG.SUPABASE_ANON_KEY;
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============ 外觀主題（跟前台共用同一套色票） ============ */
const THEMES = {
  sage:      { name:'鼠尾草綠', sage:'#5f7a5a', sageLight:'#eaf0e6', sageDark:'#3f5a3c', clay:'#c98a5e', clayLight:'#f7e9dd' },
  ocean:     { name:'海洋藍',   sage:'#4a7590', sageLight:'#e8f1f5', sageDark:'#2c4a5c', clay:'#d9a05b', clayLight:'#faf0e0' },
  lavender:  { name:'薰衣草紫', sage:'#7c6a99', sageLight:'#f0ecf7', sageDark:'#4f3f6b', clay:'#d98fa0', clayLight:'#fbe9ed' },
  sunset:    { name:'夕陽橘',   sage:'#b06a3f', sageLight:'#fbeee3', sageDark:'#7a4223', clay:'#e0a15c', clayLight:'#fdf1de' },
  forest:    { name:'深林綠',   sage:'#40593f', sageLight:'#e6ede6', sageDark:'#263a26', clay:'#8a7048', clayLight:'#f0e8d8' },
  rose:      { name:'玫瑰豆沙', sage:'#8f6870', sageLight:'#f5eced', sageDark:'#5c3a40', clay:'#c99a8a', clayLight:'#f7ede6' },
  slate:     { name:'石墨灰',   sage:'#565f6a', sageLight:'#eef0f2', sageDark:'#33373d', clay:'#8f8a7d', clayLight:'#f2efe8' }
};
function applyTheme(themeName){
  const t = THEMES[themeName] || THEMES.sage;
  const root = document.documentElement.style;
  root.setProperty('--sage', t.sage);
  root.setProperty('--sage-light', t.sageLight);
  root.setProperty('--sage-dark', t.sageDark);
  root.setProperty('--clay', t.clay);
  root.setProperty('--clay-light', t.clayLight);
}

let data = {
  store: { name:'團課教室', admin_password:'class1234', security_question:'', security_answer:'', theme:'sage', available_tags:[], tag_colors:{} },
  classes: [],   // class_templates
  teachers: [],
  members: [],
  notify: {
    reminder_enabled:true, reminder_time:'18:00', reminder_template:'',
    low_credit_enabled:true, low_credit_threshold:2,
    cancel_deadline_minutes:60, booking_window_days:30,
    booking_open_start:null, booking_open_end:null
  }
};
let registrationQuestions = []; // 會員註冊表單的問題設定
let editingRegQuestionId = null;
let newRegQOptions = []; // 新增問題時暫存的單選選項
let selectedRegistrantId = null; // 報名表單設定頁：目前查看的學員（跟學員管理共用學員資料）

let selectedMemberId = null; // 學員管理：目前展開檢視的學員
let memberBookings = [];     // 該學員的預約紀錄
let memberBatches = [];      // 該學員的堂數批次（各自效期）
let memberTransactions = []; // 該學員的金流紀錄（消費金額）
let memberHistoryFilterStart = ''; // 選課紀錄的日期篩選（開始）
let memberHistoryFilterEnd = '';   // 選課紀錄的日期篩選（結束）
let memberBatchFilterStart = '';   // 堂數紀錄的日期篩選（開始）
let memberBatchFilterEnd = '';     // 堂數紀錄的日期篩選（結束）
let memberPaymentFilterStart = ''; // 消費紀錄的日期篩選（開始）
let memberPaymentFilterEnd = '';   // 消費紀錄的日期篩選（結束）
let editingBatchId = null;   // 目前正在編輯的堂數批次 id
let memberSearchQuery = '';
let memberSortBy = 'default'; // default | credits_desc | credits_asc | name
let memberStatsCounts = {};   // line_user_id -> 指定區間內的已預約堂數
let statsMonths = 2;
/* ---- 標籤配色：可以手動選 10 種顏色其中一種，沒選過的話先用自動配色顯示 ---- */
const TAG_COLORS = [
  { bg:'#eaf0e6', text:'#3f5a3c' }, // 鼠尾草綠
  { bg:'#f7e9dd', text:'#8a5a35' }, // 土黃
  { bg:'#e3edf7', text:'#2f5a8a' }, // 藍
  { bg:'#f3e3f2', text:'#7a3f78' }, // 紫
  { bg:'#fdf1d0', text:'#8a6a1f' }, // 黃
  { bg:'#fbe3e6', text:'#9c3f52' }, // 玫瑰紅
  { bg:'#dff3ec', text:'#1f7a5c' }, // 薄荷綠
  { bg:'#e8eaf0', text:'#454f66' }, // 石板灰
  { bg:'#fbe8d6', text:'#a35a1f' }, // 橘
  { bg:'#dcf2f5', text:'#1f6f7a' }, // 青藍
];
function getTagColorIndex(tag){
  const saved = data.store.tag_colors || {};
  if(saved[tag] !== undefined && saved[tag] !== null) return saved[tag];
  let hash = 0;
  for(let i=0;i<tag.length;i++){ hash = (hash*31 + tag.charCodeAt(i)) >>> 0; }
  return hash % TAG_COLORS.length;
}
function tagColorStyle(tag){
  const c = TAG_COLORS[getTagColorIndex(tag)];
  return `background:${c.bg};color:${c.text};`;
}
async function setTagColor(tag, index){
  const colors = { ...(data.store.tag_colors||{}) };
  colors[tag] = index;
  const { error } = await db.from('store_settings').update({ tag_colors: colors }).eq('id', 1);
  if(error){ showToast('設定失敗'); console.error(error); return; }
  data.store.tag_colors = colors;
  expandedColorTag = null;
  render();
}

function todayISO(offsetDays=0){
  const d = new Date(); d.setDate(d.getDate()+offsetDays);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* 日期輔助：把 YYYY-MM-DD 轉成跟前台一致、不補零的 dateKey，例如 2026-8-5 */
function isoToDateKey(isoStr){
  const [y,m,d] = isoStr.split('-').map(Number);
  return `${y}-${m}-${d}`;
}
function dateKeyToLabel(isoStr){
  const [y,m,d] = isoStr.split('-').map(Number);
  const wd = ['日','一','二','三','四','五','六'][new Date(y,m-1,d).getDay()];
  return `${m}/${d} (週${wd})`;
}
function weekdayLabelOf(isoStr){
  const [y,m,d] = isoStr.split('-').map(Number);
  return ['日','一','二','三','四','五','六'][new Date(y,m-1,d).getDay()];
}

function showToast(msg){

}

/* ---- 課程日曆（像 Google 日曆一樣點日期來調整單日課程） ---- */
const todayNow = new Date();
let classesCalendarView = { year: todayNow.getFullYear(), month: todayNow.getMonth()+1 };
let classesCalendarSelected = null; // 目前選中的日期（YYYY-MM-DD）

function getDayOccurrences(iso){
  const wd = weekdayLabelOf(iso);
  const cancelledTemplateIds = new Set(
    dayOverrides.filter(o=>o.type==='cancel' && o.date===iso).map(o=>o.class_template_id)
  );
  const recurring = data.classes.filter(c=>c.active && (c.weekdays||[]).includes(wd) && !cancelledTemplateIds.has(c.id));
  const extras = dayOverrides.filter(o=>o.type==='extra' && o.date===iso);
  return { recurring, extras };
}

function buildClassesCalendarHTML(){
  const { year, month } = classesCalendarView;
  const startWeekday = new Date(year, month-1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  const todayIso = todayISO(0);

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="mc-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const iso = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const cellDate = new Date(year, month-1, day);
    const isPast = cellDate < today;
    const { recurring, extras } = getDayOccurrences(iso);
    const all = [...recurring.map(c=>({time:c.time, title:c.title, extra:false})), ...extras.map(o=>({time:o.time, title:o.title, extra:true}))]
      .sort((a,b)=>a.time.localeCompare(b.time));
    const isSelected = iso===classesCalendarSelected;
    const isToday = iso===todayIso;
    let cls = 'mc-cell';
    if(isPast) cls += ' past';
    if(isSelected) cls += ' selected';
    if(isToday) cls += ' today';

    const maxShow = 3;
    const chipsHtml = all.slice(0, maxShow).map(c=>
      `<div class="mc-event${c.extra?' extra':''}">${c.time.slice(0,5)} ${c.title}</div>`
    ).join('');
    const moreHtml = all.length>maxShow ? `<div class="mc-more">+${all.length-maxShow} 更多</div>` : '';

    cells += `<div class="${cls}" onclick="selectClassesCalendarDate('${iso}')">
      <span class="mc-daynum">${day}</span>
      <div class="mc-events">${chipsHtml}${moreHtml}</div>
    </div>`;
  }

  return `
    <div class="mini-calendar">
      <div class="mc-header">
        <button class="mc-nav" onclick="changeClassesCalendarMonth(-1)">‹</button>
        <span class="mc-month-label">${year} 年 ${month} 月</span>
        <button class="mc-nav" onclick="changeClassesCalendarMonth(1)">›</button>
      </div>
      <div class="mc-weekdays">${['日','一','二','三','四','五','六'].map(w=>`<span>${w}</span>`).join('')}</div>
      <div class="mc-grid">${cells}</div>
    </div>`;
}

function buildDayDetailHTML(){
  if(!classesCalendarSelected){
    return `<div class="desc" style="padding:10px 4px;">👈 點日曆上的日期，查看那天的課程並快速調整</div>`;
  }
  const iso = classesCalendarSelected;
  const label = dateKeyToLabel(isoToDateKey(iso));
  const { recurring, extras } = getDayOccurrences(iso);

  let rowsHtml = '';
  recurring.forEach(c=>{
    rowsHtml += `
    <div class="settings-row">
      <div><div class="label">${c.time}　${c.title}（${c.teacher}）</div><div class="desc">固定課程</div></div>
      <div class="row-actions">
        <button class="btn btn-ghost btn-sm" onclick="quickEditOccurrence('${iso}','${c.id}')">只修改這天</button>
        <button class="btn btn-danger btn-sm" onclick="quickCancelOccurrence('${iso}','${c.id}')">停開這天</button>
      </div>
    </div>`;
  });
  extras.forEach(o=>{
    rowsHtml += `
    <div class="settings-row">
      <div><div class="label">${o.time}　${o.title}（${o.teacher}）</div><div class="desc">⭐ 這天加開的特別課</div></div>
      <div class="row-actions">
        <button class="btn btn-ghost btn-sm" onclick="startEditExtraOverride('${o.id}')">編輯</button>
        <button class="btn btn-danger btn-sm" onclick="removeOverride('${o.id}')">刪除</button>
      </div>
    </div>`;
  });
  if(!rowsHtml) rowsHtml = `
    <div class="desc" style="padding:6px 0 10px;">這天沒有排課。</div>
    <button class="btn btn-primary btn-sm" onclick="openSingleDayFormFor('${iso}')">＋ 加開這一天的課</button>`;
  else rowsHtml += `<div style="margin-top:10px;"><button class="btn btn-ghost btn-sm" onclick="openSingleDayFormFor('${iso}')">＋ 再加開一堂特別課</button></div>`;

  return `
    <div class="label" style="margin-bottom:6px;">${label}</div>
    ${rowsHtml}`;
}
function openSingleDayFormFor(iso){
  dayOverrideDate = iso;
  showAddClassForm = true;
  classFormMode = 'single';
  editingClassId = null;
  editingOverrideId = null;
  singleDayFormPrefill = null;
  render();
  setTimeout(()=>{
    const el = document.getElementById('classFormPanel');
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, 60);
}

function selectClassesCalendarDate(iso){
  classesCalendarSelected = iso;
  dayOverrideDate = iso; // 同步到下方手動表單的日期欄，方便直接加開特別課
  render();
}
function changeClassesCalendarMonth(delta){
  let { year, month } = classesCalendarView;
  month += delta;
  if(month<1){ month=12; year--; }
  if(month>12){ month=1; year++; }
  classesCalendarView = { year, month };
  render();
}
async function quickCancelOccurrence(iso, templateId){
  const already = dayOverrides.some(o=>o.type==='cancel' && o.date===iso && o.class_template_id===templateId);
  if(already){ showToast('這天已經停開了'); return; }
  const { error } = await db.from('class_overrides').insert({ type:'cancel', date:iso, class_template_id:templateId });
  if(error){ showToast('操作失敗'); console.error(error); return; }
  await loadDayOverrides();
  render();
  showToast('已停開這一天的課');
}
/* ---- 統一的「新增課程」表單模式 ---- */
let classFormMode = 'recurring'; // 'recurring'（每週固定）| 'single'（只有這一天）
let showAddClassForm = false;    // 表單預設收起，避免畫面太滿
let editingOverrideId = null;    // 目前正在編輯的特別課（單日加開）id
let singleDayFormPrefill = null; // 開啟「只有這一天」表單時，預先帶入的內容

function setClassFormMode(mode){ classFormMode = mode; render(); }
function toggleAddClassForm(){
  showAddClassForm = !showAddClassForm;
  if(!showAddClassForm){ editingOverrideId = null; singleDayFormPrefill = null; }
  render();
}

async function quickEditOccurrence(iso, templateId){
  const tmpl = data.classes.find(c=>c.id===templateId);
  if(!tmpl) return;
  await quickCancelOccurrence(iso, templateId); // 先停開原本這天的固定課，改用下面的特別課取代
  dayOverrideDate = iso;
  showAddClassForm = true;
  classFormMode = 'single';
  editingClassId = null;
  editingOverrideId = null; // 這是新增一堂特別課，不是編輯既有的
  singleDayFormPrefill = { title:tmpl.title, teacher:tmpl.teacher, time:tmpl.time, cap:tmpl.cap, description:tmpl.description||'' };
  render();
  setTimeout(()=>{
    const el = document.getElementById('classFormPanel');
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, 60);
  showToast('已停開原本這天的課，內容已幫你帶到下方表單，改完直接送出即可');
}

function startEditExtraOverride(id){
  const o = dayOverrides.find(x=>x.id===id && x.type==='extra');
  if(!o) return;
  editingOverrideId = id;
  dayOverrideDate = o.date;
  singleDayFormPrefill = { title:o.title, teacher:o.teacher, time:o.time, cap:o.cap, description:o.description||'' };
  showAddClassForm = true;
  classFormMode = 'single';
  editingClassId = null;
  render();
  setTimeout(()=>{
    const el = document.getElementById('classFormPanel');
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, 60);
}
function cancelEditExtraOverride(){
  editingOverrideId = null;
  singleDayFormPrefill = null;
  showAddClassForm = false;
  render();
}
async function saveExtraOverrideEdit(){
  const title = document.getElementById('ovExtraTitle').value.trim();
  const teacher = document.getElementById('ovExtraTeacher').value;
  const time = document.getElementById('ovExtraTime').value;
  const cap = Number(document.getElementById('ovExtraCap').value)||12;
  const description = document.getElementById('ovExtraDescription').value.trim();
  if(!title){ showToast('請輸入課程名稱'); return; }
  if(!teacher){ showToast('請先在「老師管理」新增至少一位老師'); return; }
  const { error } = await db.from('class_overrides').update({ title, teacher, time, cap, description }).eq('id', editingOverrideId);
  if(error){ showToast('儲存失敗'); console.error(error); return; }
  editingOverrideId = null;
  singleDayFormPrefill = null;
  showAddClassForm = false;
  await loadDayOverrides();
  render();
  showToast('已儲存修改');
}

async function saveClassForm(){
  const title = document.getElementById('ncTitle').value.trim();
  const teacher = document.getElementById('ncTeacher').value;
  const time = document.getElementById('ncTime').value;
  const duration = Number(document.getElementById('ncDuration').value)||60;
  const cap = Number(document.getElementById('ncCap').value)||10;
  const weekdays = [...document.querySelectorAll('#ncDays .wd-chip.on')].map(el=>el.dataset.w);
  const description = document.getElementById('ncDescription').value.trim();
  if(!title){ showToast('請輸入課程名稱'); return; }
  if(weekdays.length===0){ showToast('請至少選擇一個上課星期'); return; }
  if(!teacher){ showToast('請先在「老師管理」新增至少一位老師'); return; }

  if(editingClassId){
    const { error } = await db.from('class_templates').update({ title, teacher, time, duration, cap, weekdays, description }).eq('id', editingClassId);
    if(error){ showToast('儲存失敗，請稍後再試'); console.error(error); return; }
    editingClassId = null;
    await loadAdminState();
    showToast('已儲存修改');
    render();
  } else {
    const { error } = await db.from('class_templates').insert({ title, teacher, time, duration, cap, weekdays, description, active:true });
    if(error){ showToast('新增失敗，請稍後再試'); console.error(error); return; }
    await loadAdminState();
    showToast('已新增課程範本，將自動套用到未來課表');
    render();
  }
}

}

async function addMemberTagFromSelect(lineUserId, tag){
  if(!tag){ expandedTagMemberId = null; render(); return; } // 選到空白選項＝收起
  const m = data.members.find(x=>x.line_user_id===lineUserId);

  if(tags.includes(tag)){ showToast('這個標籤已經加過了'); expandedTagMemberId = null; render(); return; }
  const newTags = [...tags, tag];
  const { error } = await db.from('members').update({ tags:newTags }).eq('line_user_id', lineUserId);

  m.tags = newTags;
  expandedTagMemberId = null; // 選完直接收起，不用再按收起
  render();
}
async function removeMemberTag(lineUserId, tag){
  const m = data.members.find(x=>x.line_user_id===lineUserId);

  const newTags = (m.tags||[]).filter(t=>t!==tag);
  const { error } = await db.from('members').update({ tags:newTags }).eq('line_user_id', lineUserId);

// 堂數異動（加堂／扣堂／編輯／刪除批次）共用同一把鎖，防止手滑連點或雙擊
// 造成同一個動作被送出兩次，導致堂數被重複增減（這是之前資料出現重複批次
// 最可能的成因之一：畫面重繪前的短暫空檔被連點兩次，兩次都讀到同一個舊數字）。
let isProcessingCreditAction = false;
async function runCreditAction(fn){
  if(isProcessingCreditAction){ showToast('請稍候，上一個動作還在處理中'); return; }
  isProcessingCreditAction = true;
  try{ await fn(); } finally{ isProcessingCreditAction = false; }
}
let memberTagFilter = '';

function toggleMemberSelect(lineUserId, checked){
  if(checked) selectedMemberIds.add(lineUserId);
  else selectedMemberIds.delete(lineUserId);
  render();
}
function toggleSelectAllFiltered(list){
  const allSelected = list.every(m=>selectedMemberIds.has(m.line_user_id));
  if(allSelected) list.forEach(m=>selectedMemberIds.delete(m.line_user_id));
  else list.forEach(m=>selectedMemberIds.add(m.line_user_id));
  render();
}
function onMemberTagFilter(val){ memberTagFilter = val; render(); }

function onBatchCreditExpiryTypeChange(val){
  document.getElementById('bcDateField').style.display = val==='date' ? 'flex' : 'none';
  document.getElementById('bcDaysField').style.display = val==='days' ? 'flex' : 'none';
}
async function submitBatchCredits(){
  const memberIds = [...selectedMemberIds];
  if(memberIds.length===0){ showToast('請先在下方學員列表勾選要處理的學員'); return; }
  const amount = Number(document.getElementById('bcAmount').value);
  if(!amount || amount<=0){ showToast('請輸入正確的堂數'); return; }
  const expiryType = document.getElementById('bcExpiryType').value;

  let expiresAt = null;
  if(expiryType==='date'){
    const val = document.getElementById('bcExpiryDate').value;
    if(!val){ showToast('請選擇到期日'); return; }
    expiresAt = val;
  } else if(expiryType==='days'){
    const days = Number(document.getElementById('bcExpiryDays').value);
    if(!days || days<=0){ showToast('請輸入正確的天數'); return; }
    expiresAt = todayISO(days);
  }

  const amountPaidInput = document.getElementById('bcAmountPaid').value.trim();
  const amountPaid = amountPaidInput === '' ? null : Number(amountPaidInput);
  if(amountPaidInput !== '' && (isNaN(amountPaid) || amountPaid<0)){ showToast('請輸入正確的金額'); return; }

  for(const lineUserId of memberIds){
    const batchId = await addCreditsToBatch(lineUserId, amount, expiresAt);
    const m = data.members.find(x=>x.line_user_id===lineUserId);
    const newRemaining = (m ? m.remaining_credits : 0) + amount;
    const newTotal = (m ? m.total_credits : 0) + amount;
    await db.from('members').update({ remaining_credits:newRemaining, total_credits:newTotal }).eq('line_user_id', lineUserId);
    if(m){ m.remaining_credits = newRemaining; m.total_credits = newTotal; }
    if(amountPaid !== null){
      await insertTransaction({ type:'income', amount:amountPaid, note:`＋${amount} 堂`, lineUserId, creditBatchId: batchId });
    }
  }

  render();
  showToast(`已幫 ${memberIds.length} 位學員新增 ${amount} 堂${expiresAt ? '，效期至 '+expiresAt : '（永久有效）'}${amountPaid!==null ? '，每人實收 NT$'+amountPaid : ''}`);
}

function sortColumn(col){
  if(memberSortBy === col+'_asc') memberSortBy = col+'_desc';
  else if(memberSortBy === col+'_desc') memberSortBy = 'default';
  else memberSortBy = col+'_asc';
  render();
}
function sortArrow(col){
  if(memberSortBy===col+'_asc') return '<span style="color:var(--sage-dark);">▲</span>';
  if(memberSortBy===col+'_desc') return '<span style="color:var(--sage-dark);">▼</span>';
  return '<span style="color:var(--muted);opacity:.5;">↕</span>';
}

async function deleteMember(lineUserId){
  const m = data.members.find(x=>x.line_user_id===lineUserId);
  if(!m) return;
  const ok = confirm(`確定要刪除學員「${m.display_name||'（尚未取得姓名）'}」嗎？\n這會一併刪除他的所有預約與堂數紀錄，無法復原。`);
  if(!ok) return;
  const { error } = await db.from('members').delete().eq('line_user_id', lineUserId);
  if(error){ showToast('刪除失敗'); console.error(error); return; }
  data.members = data.members.filter(x=>x.line_user_id!==lineUserId);
  selectedMemberIds.delete(lineUserId);
  render();
  showToast('已刪除學員');
}

async function clearMemberRegistration(lineUserId){
  const m = data.members.find(x=>x.line_user_id===lineUserId);
  if(!m) return;
  const ok = confirm('確定要清除這位學員的會員註冊資料嗎？\n清除後他的堂數、預約紀錄都會保留，但下次打開前台會被系統當成「新學員」，重新跳出會員註冊表單。');
  if(!ok) return;
  const { error } = await db.from('members').update({
    registration_name: null, registration_contact: null, registration_answers: {}, registration_submitted_at: null
  }).eq('line_user_id', lineUserId);
  if(error){ showToast('清除失敗'); console.error(error); return; }
  m.registration_name = null; m.registration_contact = null; m.registration_answers = {}; m.registration_submitted_at = null;
  render();
  showToast('已清除會員註冊資料');
}

async function applyStatsMonths(){
  const months = Number(document.getElementById('statsMonthsInput').value) || 1;
  statsMonths = months;
  statsRangeStart = todayISO(0);
  statsRangeEnd = todayISO(months*30);
  await loadMemberStats();
  render();
  showToast(`已套用未來 ${months} 個月的統計`);
}
async function applyStatsRange(){
  const start = document.getElementById('statsStart').value;
  const end = document.getElementById('statsEnd').value;
  if(!start || !end){ showToast('請選擇開始與結束日期'); return; }
  if(end < start){ showToast('結束日期不能早於開始日期'); return; }
  statsRangeStart = start; statsRangeEnd = end;
  await loadMemberStats();
  render();
  showToast('已更新統計區間');
}

/* ---- 堂數批次系統：每批各自的效期，扣款依「最快到期優先」 ---- */
async function consumeCreditsFromBatches(lineUserId, count){
  // 從最快到期的批次開始扣，回傳實際扣到的批次 id 陣列（用不到時可忽略）
  const { data: batches, error } = await db.from('credit_batches')
    .select('id, remaining, expires_at')
    .eq('line_user_id', lineUserId)
    .gt('remaining', 0)
    .order('expires_at', { ascending:true, nullsFirst:false });
  if(error || !batches) return;
  let left = count;
  for(const b of batches){
    if(left<=0) break;
    const take = Math.min(b.remaining, left);
    await db.from('credit_batches').update({ remaining: b.remaining - take }).eq('id', b.id);
    left -= take;
  }
}
async function addCreditsToBatch(lineUserId, amount, expiresAt){
  const { data, error } = await db.from('credit_batches')
    .insert({ line_user_id: lineUserId, amount, remaining: amount, expires_at: expiresAt })
    .select('id').single();
  return (!error && data) ? data.id : null;
}

// 金流紀錄（收入／支出）共用寫入函式。amount 一律存正數，type 決定是收入還是支出。
async function insertTransaction({ type, amount, note, lineUserId, creditBatchId, occurredAt }){
  await db.from('transactions').insert({
    type, amount, note: note || '',
    line_user_id: lineUserId || null,
    credit_batch_id: creditBatchId || null,
    occurred_at: occurredAt || todayISO(0)
  });
}
async function loadMemberBatches(lineUserId){
  const { data, error } = await db.from('credit_batches')
    .select('*').eq('line_user_id', lineUserId).order('expires_at', { ascending:true, nullsFirst:false });
  memberBatches = (!error && data) ? data : [];
}
async function loadMemberTransactions(lineUserId){
  const { data, error } = await db.from('transactions')
    .select('*').eq('line_user_id', lineUserId).order('occurred_at', { ascending:false });
  memberTransactions = (!error && data) ? data : [];
}

function startEditBatch(batchId){ editingBatchId = batchId; render(); }
function cancelEditBatch(){ editingBatchId = null; render(); }

async function saveEditBatch(batchId, lineUserId){
  const newAmount = Number(document.getElementById(`ebAmount-${batchId}`).value);
  const newRemaining = Number(document.getElementById(`ebRemaining-${batchId}`).value);
  const newExpiry = document.getElementById(`ebExpiry-${batchId}`).value || null;
  const sync = document.getElementById(`ebSync-${batchId}`).checked;
  if(isNaN(newAmount) || newAmount<0){ showToast('請輸入正確的原始堂數'); return; }
  if(isNaN(newRemaining) || newRemaining<0){ showToast('請輸入正確的剩餘堂數'); return; }

  const batch = memberBatches.find(b=>b.id===batchId);
  if(!batch) return;
  const remainingDelta = newRemaining - batch.remaining; // 改動的差額，同步時會反映到會員的剩餘堂數
  const amountDelta = newAmount - batch.amount; // 原始堂數的改動，同步時會反映到會員的歷史總量

  const { error } = await db.from('credit_batches').update({ amount:newAmount, remaining:newRemaining, expires_at:newExpiry }).eq('id', batchId);
  if(error){ showToast('更新失敗'); console.error(error); return; }

  if(sync && (remainingDelta !== 0 || amountDelta !== 0)){
    const m = data.members.find(x=>x.line_user_id===lineUserId);
    const newMemberRemaining = Math.max(0, (m ? m.remaining_credits : 0) + remainingDelta);
    const newMemberTotal = Math.max(0, (m ? (m.total_credits||0) : 0) + amountDelta);
    await db.from('members').update({ remaining_credits:newMemberRemaining, total_credits:newMemberTotal }).eq('line_user_id', lineUserId);
    if(m){ m.remaining_credits = newMemberRemaining; m.total_credits = newMemberTotal; }
  }

  editingBatchId = null;
  await loadMemberBatches(lineUserId);
  render();
  showToast(sync ? '已更新這批堂數' : '已更新這批堂數（未連動會員總量／剩餘堂數）');
}

async function deleteBatch(batchId, lineUserId){
  const batch = memberBatches.find(b=>b.id===batchId);
  if(!batch) return;
  const ok = confirm(`確定要刪除這筆批次紀錄嗎？（原始堂數 ${batch.amount} 堂、剩餘 ${batch.remaining} 堂）\n通常用於刪除重複或錯誤的紀錄，無法復原。`);
  if(!ok) return;
  const sync = confirm(`要同步從會員的「剩餘堂數」與「歷史總量」扣除這筆的數字嗎？\n\n選「確定」＝這筆本來就是真實堂數，刪除後會員的堂數也要跟著減少\n選「取消」＝這筆只是重複／打錯的紀錄，會員原本的堂數其實是對的，不要跟著變動`);

  let { error } = await db.from('credit_batches').delete().eq('id', batchId);
  let zeroedInstead = false;

  if(error && error.code === '23503'){
    // 這筆批次已經被預約紀錄引用（外鍵保護），資料庫不允許真的刪除整筆，
    // 改成把它歸零，效果一樣（不會再被算進任何堂數），但不會留下斷掉的關聯
    const zeroRes = await db.from('credit_batches').update({ amount:0, remaining:0 }).eq('id', batchId);
    if(zeroRes.error){ showToast('刪除失敗，歸零也失敗，請稍後再試'); console.error(zeroRes.error); return; }
    error = null;
    zeroedInstead = true;
  }
  if(error){ showToast('刪除失敗'); console.error(error); return; }

  if(sync){
    const m = data.members.find(x=>x.line_user_id===lineUserId);
    if(m){
      const newMemberRemaining = Math.max(0, m.remaining_credits - batch.remaining);
      const newMemberTotal = Math.max(0, (m.total_credits||0) - batch.amount);
      await db.from('members').update({ remaining_credits:newMemberRemaining, total_credits:newMemberTotal }).eq('line_user_id', lineUserId);
      m.remaining_credits = newMemberRemaining;
      m.total_credits = newMemberTotal;
    }
  }

  await loadMemberBatches(lineUserId);
  render();
  if(zeroedInstead){
    showToast('這筆批次已被預約紀錄引用，系統改成把它歸零（效果相同），沒有真的刪除整筆紀錄');
  } else {
    showToast(sync ? '已刪除這筆批次紀錄' : '已刪除這筆批次紀錄（未連動會員總量／剩餘堂數）');
  }
}

async function setMemberCredits(lineUserId){
  const input = document.getElementById(`setCredits-${lineUserId}`);
  const val = Number(input.value);
  if(isNaN(val) || val<0){ showToast('請輸入正確的數字'); return; }
  const m = data.members.find(x=>x.line_user_id===lineUserId);
  if(!m) return;
  const diff = val - m.remaining_credits;

  if(diff>0){
    const expiresAt = getRowExpiryInput(lineUserId); // 讀取這一列的效期欄位，留空＝永久有效
    await addCreditsToBatch(lineUserId, diff, expiresAt);
    const newTotal = (m.total_credits||0) + diff;
    await db.from('members').update({ remaining_credits: val, total_credits: newTotal }).eq('line_user_id', lineUserId);
    m.total_credits = newTotal;
  } else if(diff<0){
    await consumeCreditsFromBatches(lineUserId, -diff);
    await db.from('members').update({ remaining_credits: val }).eq('line_user_id', lineUserId);
  }
  m.remaining_credits = val;
  render();
  showToast(`已將堂數設定為 ${val} 堂`);
}

// 補救舊資料：堂數批次系統是後來才加的，在那之前的堂數異動只直接改 members.remaining_credits，
// 沒有經過批次，導致批次總和跟會員實際剩餘堂數對不上（甚至完全沒有批次紀錄）。
// 這裡用「會員目前剩餘堂數」當作正確答案（因為預約時系統就是看這個欄位判斷能不能約），
// 把批次紀錄校正到跟它一致：
// 1. 完全沒有批次、但 total_credits 記得到歷史總量的話，補一筆代表這段歷史的批次
// 2. 批次剩餘總和比實際剩餘少 → 補一筆差額（沒被追蹤到的堂數）
// 3. 批次剩餘總和比實際剩餘多（舊資料不同步）→ 用「越快到期先扣」的規則把多的部分扣掉
async function reconcileMemberCredits(lineUserId){
  const m = data.members.find(x=>x.line_user_id===lineUserId);
  if(!m) return;

  if(memberBatches.length===0 && (m.total_credits||0) > 0){
    const amount = m.total_credits;
    const remaining = Math.max(0, Math.min(m.remaining_credits, amount));
    await db.from('credit_batches').insert({ line_user_id: lineUserId, amount, remaining, expires_at: null });
    await loadMemberBatches(lineUserId);
    return;
  }

  const tracked = memberBatches.reduce((s,b)=>s+b.remaining, 0);
  const gap = m.remaining_credits - tracked;
  if(gap > 0){
    await addCreditsToBatch(lineUserId, gap, null);
    await loadMemberBatches(lineUserId);
  } else if(gap < 0){
    await consumeCreditsFromBatches(lineUserId, -gap);
    await loadMemberBatches(lineUserId);
  }
}

async function addCreditsForCurrentMember(){
  const lineUserId = selectedMemberId;
  const m = data.members.find(x=>x.line_user_id===lineUserId);
  if(!m) return;
  const amount = Number(document.getElementById('mdCreditAmount').value);
  if(!amount || amount<=0){ showToast('請輸入正確的堂數'); return; }
  const expiryType = document.getElementById('mdCreditExpiryType').value;

  let expiresAt = null;
  if(expiryType==='date'){
    const val = document.getElementById('mdCreditExpiryDate').value;
    if(!val){ showToast('請選擇到期日'); return; }
    expiresAt = val;
  } else if(expiryType==='days'){
    const days = Number(document.getElementById('mdCreditExpiryDays').value);
    if(!days || days<=0){ showToast('請輸入正確的天數'); return; }
    expiresAt = todayISO(days);
  }

  const amountPaidInput = document.getElementById('mdAmountPaid').value.trim();
  const amountPaid = amountPaidInput === '' ? null : Number(amountPaidInput);
  if(amountPaidInput !== '' && (isNaN(amountPaid) || amountPaid<0)){ showToast('請輸入正確的金額'); return; }

  const batchId = await addCreditsToBatch(lineUserId, amount, expiresAt);
  const newRemaining = m.remaining_credits + amount;
  const newTotal = (m.total_credits||0) + amount;
  await db.from('members').update({ remaining_credits:newRemaining, total_credits:newTotal }).eq('line_user_id', lineUserId);
  m.remaining_credits = newRemaining;
  m.total_credits = newTotal;

  if(amountPaid !== null){
    await insertTransaction({ type:'income', amount:amountPaid, note:`＋${amount} 堂`, lineUserId, creditBatchId: batchId });
  }

  await loadMemberBatches(lineUserId);
  await loadMemberTransactions(lineUserId);
  render();
  showToast(`已新增 ${amount} 堂${expiresAt ? '，效期至 '+expiresAt : '（永久有效）'}${amountPaid!==null ? '，實收 NT$'+amountPaid : ''}`);
}

async function submitBatchBooking(){
  const memberIds = [...selectedMemberIds];
  if(memberIds.length===0){ showToast('請先在上方學員列表勾選要處理的學員'); return; }
  const selected = document.getElementById('bbClass').value;
  if(!selected){ showToast('請選擇課程'); return; }
  const [type, id] = selected.split(':');

  let successCount = 0;
  const skipped = [];

  if(type==='t'){
    const tmpl = data.classes.find(c=>c.id===id);
    if(!tmpl){ showToast('找不到課程範本'); return; }
    const dateValues = [...document.querySelectorAll('.bbDateInput')].map(i=>i.value).filter(Boolean);
    const uniqueDates = [...new Set(dateValues)];
    if(uniqueDates.length===0){ showToast('請至少選擇一個日期'); return; }

    for(const lineUserId of memberIds){
      for(const dateVal of uniqueDates){
        const wd = weekdayLabelOf(dateVal);
        if(!(tmpl.weekdays||[]).includes(wd)){ skipped.push(`${memberName(lineUserId)} ${dateVal}`); continue; }
        const dateKey = isoToDateKey(dateVal);
        const ok = await insertOneBooking(lineUserId, {
          classKey: `${dateKey}_${tmpl.id}`, classTemplateId: tmpl.id, title: tmpl.title,
          classDate: dateKeyToLabel(dateVal), classDateIso: dateVal,
          time: tmpl.time, teacher: tmpl.teacher, cap: tmpl.cap
        });
        if(ok) successCount++; else skipped.push(`${memberName(lineUserId)} ${dateVal}`);
      }
    }
  } else {
    const override = dayOverrides.find(o=>o.id===id && o.type==='extra');
    if(!override){ showToast('找不到這堂特別課'); return; }
    const dateKey = isoToDateKey(override.date);
    for(const lineUserId of memberIds){
      const ok = await insertOneBooking(lineUserId, {
        classKey: `${dateKey}_extra_${override.id}`, classTemplateId: null, title: override.title,
        classDate: dateKeyToLabel(override.date), classDateIso: override.date,
        time: override.time, teacher: override.teacher, cap: override.cap
      });
      if(ok) successCount++; else skipped.push(`${memberName(lineUserId)}`);
    }
  }

  await loadAdminState();
  render();
  if(successCount>0) showToast(`成功新增 ${successCount} 筆預約`);
  if(skipped.length>0) showToast(`有 ${skipped.length} 筆未成功：${skipped.slice(0,3).join('、')}`);
}

function pageMemberDetail(){
  const m = data.members.find(x=>x.line_user_id===selectedMemberId);
  if(!m){ selectedMemberId = null; return pageMembers(); }

  function isBookingPast(b){
    if(!b.class_date_iso) return false;
    const [y,mo,d] = b.class_date_iso.split('-').map(Number);
    const [hh,mm] = (b.class_time||'00:00').split(':').map(Number);
    return new Date(y, mo-1, d, hh, mm) <= new Date();
  }

  const filteredBookings = memberBookings.filter(b=>{
    if(!b.class_date_iso) return true; // 沒有 iso 日期的舊資料，不篩選掉
    if(memberHistoryFilterStart && b.class_date_iso < memberHistoryFilterStart) return false;
    if(memberHistoryFilterEnd && b.class_date_iso > memberHistoryFilterEnd) return false;
    return true;
  });
  const historyRows = filteredBookings.map(b=>{
    const past = b.status==='active' && isBookingPast(b);
    const statusLabel = b.status!=='active' ? '已取消' : (past ? '已結束' : '已預約');
    const statusClass = b.status!=='active' ? 'off' : (past ? 'warn' : 'on');
    return `
    <tr>
      <td>${b.class_date} ${b.class_time}</td>
      <td>${b.class_title}（${b.teacher}）</td>
      <td><span class="tag ${statusClass}">${statusLabel}</span></td>
      <td>${(b.status==='active' && !past) ? `<div class="row-actions"><button class="btn btn-danger btn-sm" onclick="runCreditAction(()=>adminCancelBooking('${b.id}'))">取消</button></div>` : ''}</td>
    </tr>`;
  }).join('');

  // 堂數紀錄：每一批堂數依「加入時間」分一列，把這批的堂數依目前狀態分類
  // （已約課／已結束／未使用／已過期），完全依照 amount 跟實際預約紀錄反推，
  // 不依賴 remaining 欄位，避免舊資料的 remaining 不準確而連帶顯示錯誤。
  //
  // 很多較舊的預約紀錄（尤其是資料匯入當時建立的）沒有寫入 credit_batch_id，
  // 沒辦法直接看出是哪一批堂數扣的。先把「有明確連結」的預約歸到對應批次，
  // 剩下「沒有連結」的預約，依批次建立時間先後、依序分配進還有空位的批次
  // （類似系統實際扣堂數時「越早的批次越先用」的邏輯），這樣不管學員手上
  // 只有一筆還是好幾筆批次，都能盡量還原出合理的分配，而不是整批算成未使用。
  function computeBatchAssignments(){
    const activeBatches = [...memberBatches].filter(b=>b.amount>0)
      .sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
    const activeBatchIds = new Set(activeBatches.map(b=>b.id));
    const activeBookings = memberBookings.filter(bk=>bk.status==='active');
    // 「有連結」只算連到還有效（原始堂數>0）的批次；如果連結到的批次後來被
    // 歸零／作廢了，這筆預約就變成「孤兒」，要跟沒連結的預約一起重新分配，
    // 不然這堂實際上過的課會直接消失不見，害其他批次被誤判成還有堂數沒用。
    const linkedBookings = activeBookings.filter(bk=>bk.credit_batch_id && activeBatchIds.has(bk.credit_batch_id));
    const orphanBookings = activeBookings.filter(bk=>!bk.credit_batch_id || !activeBatchIds.has(bk.credit_batch_id))
      .sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));

    const assignment = {};
    activeBatches.forEach(b=>{ assignment[b.id] = []; });
    linkedBookings.forEach(bk=>{ assignment[bk.credit_batch_id].push(bk); });

    let idx = 0;
    for(const b of activeBatches){
      let capacity = b.amount - assignment[b.id].length;
      while(capacity > 0 && idx < orphanBookings.length){
        assignment[b.id].push(orphanBookings[idx]);
        idx++; capacity--;
      }
    }
    return assignment;
  }
  const batchAssignments = computeBatchAssignments();

  function batchStatusBreakdown(batch){
    const list = batchAssignments[batch.id] || [];
    const booked = list.filter(bk => !isBookingPast(bk)).length;
    const finished = list.filter(bk => isBookingPast(bk)).length;
    const leftover = Math.max(0, batch.amount - booked - finished);
    const isExpired = batch.expires_at && batch.expires_at < todayISO(0);
    return {
      booked, finished,
      expired: isExpired ? leftover : 0,
      unused: isExpired ? 0 : leftover
    };
  }

  const batchDateKey = b => new Date(b.created_at).toISOString().slice(0,10);
  const filteredBatches = memberBatches.filter(b=>{
    const key = batchDateKey(b);
    if(memberBatchFilterStart && key < memberBatchFilterStart) return false;
    if(memberBatchFilterEnd && key > memberBatchFilterEnd) return false;
    return true;
  });

  const paymentRecords = memberTransactions.filter(t=> t.type==='income');
  const filteredPayments = paymentRecords.filter(t=>{
    if(memberPaymentFilterStart && t.occurred_at < memberPaymentFilterStart) return false;
    if(memberPaymentFilterEnd && t.occurred_at > memberPaymentFilterEnd) return false;
    return true;
  }).sort((a,b)=> new Date(b.occurred_at) - new Date(a.occurred_at));
  const paymentTotal = filteredPayments.reduce((s,t)=> s + Number(t.amount), 0);
  const paymentRows = filteredPayments.map(t=>`
    <tr>
      <td>${t.occurred_at}</td>
      <td>NT$ ${Number(t.amount).toLocaleString()}</td>
      <td>${t.note || '—'}</td>
    </tr>`).join('');

  return `
    <div class="page-title">
      <span style="cursor:pointer;color:var(--sage);font-size:14px;" onclick="backToMemberList()">← 返回學員列表</span>
    </div>
    <div class="page-title" style="margin-top:8px;display:flex;align-items:center;gap:10px;">
      ${m.picture_url ? `<img src="${m.picture_url}" style="width:34px;height:34px;border-radius:50%;object-fit:cover;">` : ''}
      ${m.display_name || '（未知學員）'}
    </div>
    <div class="page-sub">目前剩餘堂數：<b>${m.remaining_credits}</b> 堂</div>

    <div class="panel">
      <div class="panel-head">
        <h3>會員註冊資料</h3>
        ${m.registration_submitted_at ? `<button class="btn btn-danger btn-sm" onclick="clearMemberRegistration('${m.line_user_id}')">清除註冊資料</button>` : ''}
      </div>
      ${m.registration_submitted_at ? `
      <div class="panel-body" style="display:flex;gap:24px;flex-wrap:wrap;font-size:13px;color:var(--muted);">
        <div>填寫姓名：<b style="color:var(--ink);">${m.registration_name||'—'}</b></div>
        <div>e-mail：<b style="color:var(--ink);">${m.registration_contact||'—'}</b></div>
        <div>填寫時間：<b style="color:var(--ink);">${new Date(m.registration_submitted_at).toLocaleString('zh-TW')}</b></div>
      </div>
      <div class="panel-body pad0" style="border-top:1px solid var(--line);">
        <table><tbody>${registrationQuestions.map(q=>`
          <tr>
            <td style="padding:11px 18px;border-bottom:1px solid var(--line);width:40%;">${q.question}</td>
            <td style="padding:11px 18px;border-bottom:1px solid var(--line);">${(m.registration_answers && m.registration_answers[q.id]) || '<span style="color:var(--muted);">（未回答）</span>'}</td>
          </tr>`).join('') || '<tr><td style="padding:16px 18px;color:var(--muted);text-align:center;">表單目前沒有額外問題</td></tr>'}</tbody></table>
      </div>` : `
      <div class="panel-body" style="text-align:center;color:var(--muted);padding:20px;">這位學員還沒填過會員註冊資料</div>`}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch;">
      <div class="panel" style="display:flex;flex-direction:column;">
        <div class="panel-head"><h3>新增堂數</h3></div>
        <div class="panel-body">
          <div class="form-grid">

            <div class="field" id="mdExpiryDaysField" style="display:none;"><label>幾天後到期</label><input id="mdCreditExpiryDays" type="number" value="30" min="1"></div>
            <div class="field" style="grid-column:1/-1;"><label>實收金額（選填，NT$）</label><input id="mdAmountPaid" type="number" min="0" placeholder="有實際收款的話填這裡，用來算營收"></div>

async function insertOneBooking(lineUserId, c){
  // 先找一批還有剩的堂數批次來扣（越快到期的優先扣）
  let batchId = null, batchRemainingBefore = null;
  const { data: batches } = await db.from('credit_batches')
    .select('id, remaining').eq('line_user_id', lineUserId).gt('remaining', 0)
    .order('expires_at', { ascending:true, nullsFirst:false });
  if(batches && batches.length>0){
    const b = batches[0];
    batchId = b.id; batchRemainingBefore = b.remaining;
    await db.from('credit_batches').update({ remaining: b.remaining - 1 }).eq('id', b.id);
  }

  const { error } = await db.from('bookings').insert({
    line_user_id: lineUserId, class_key: c.classKey, class_template_id: c.classTemplateId,
    class_title: c.title, class_date: c.classDate, class_date_iso: c.classDateIso, class_time: c.time,
    teacher: c.teacher, cap: c.cap, status: 'active', credit_batch_id: batchId
  });

  if(error){
    if(batchId!==null) await db.from('credit_batches').update({ remaining: batchRemainingBefore }).eq('id', batchId); // 失敗就把批次退回去
    return false;
  }

  const m = data.members.find(x=>x.line_user_id===lineUserId);
  const newCredits = Math.max(0, (m ? m.remaining_credits : 0) - 1);
  await db.from('members').update({ remaining_credits: newCredits }).eq('line_user_id', lineUserId);
  if(m) m.remaining_credits = newCredits;
  return true;
}

async function adminAddBooking(lineUserId){
  const selected = document.getElementById('adNewClass').value; // 't:xxx' 或 'e:xxx'
  if(!selected){ showToast('請選擇課程'); return; }
  const [type, id] = selected.split(':');

  if(type==='t'){
    const tmpl = data.classes.find(c=>c.id===id);
    if(!tmpl){ showToast('找不到課程範本'); return; }

    const dateValues = [...document.querySelectorAll('.adDateInput')].map(i=>i.value).filter(Boolean);
    const uniqueDates = [...new Set(dateValues)];
    if(uniqueDates.length===0){ showToast('請至少選擇一個日期'); return; }

    let successCount = 0;
    const skipped = [];
    for(const dateVal of uniqueDates){
      const wd = weekdayLabelOf(dateVal);
      if(!(tmpl.weekdays||[]).includes(wd)){
        skipped.push(`${dateVal}（每週${wd}沒開這堂課）`);
        continue;
      }
      const dateKey = isoToDateKey(dateVal);
      const ok = await insertOneBooking(lineUserId, {
        classKey: `${dateKey}_${tmpl.id}`, classTemplateId: tmpl.id, title: tmpl.title,
        classDate: dateKeyToLabel(dateVal), classDateIso: dateVal,
        time: tmpl.time, teacher: tmpl.teacher, cap: tmpl.cap
      });
      if(ok) successCount++; else skipped.push(`${dateVal}（可能已經預約過）`);
    }

    await openMemberDetail(lineUserId);
    if(successCount>0) showToast(`已新增 ${successCount} 筆預約，共扣除 ${successCount} 堂`);
    if(skipped.length>0) showToast(`有 ${skipped.length} 筆沒有新增成功：${skipped.slice(0,3).join('、')}`);

  } else {
    const override = dayOverrides.find(o=>o.id===id && o.type==='extra');
    if(!override){ showToast('找不到這堂特別課'); return; }
    const dateKey = isoToDateKey(override.date);
    const ok = await insertOneBooking(lineUserId, {
      classKey: `${dateKey}_extra_${override.id}`, classTemplateId: null, title: override.title,
      classDate: dateKeyToLabel(override.date), classDateIso: override.date,
      time: override.time, teacher: override.teacher, cap: override.cap
    });
    await openMemberDetail(lineUserId);
    showToast(ok ? '已幫學員新增這筆預約，並扣除 1 堂' : '新增失敗，可能已經預約過這堂課');
  }
}

async function adminCancelBooking(bookingId){
  const b = memberBookings.find(x=>x.id===bookingId);
  if(!b) return;
  const { data: updated, error } = await db.from('bookings').update({ status:'cancelled' }).eq('id', bookingId).eq('status', 'active').select('id');
  if(error){ showToast('取消失敗'); console.error(error); return; }
  if(!updated || updated.length===0){ showToast('這筆已經是取消狀態了'); return; } // 防止連點造成重複退還堂數

  if(b.credit_batch_id){
    const { data: batch } = await db.from('credit_batches').select('remaining').eq('id', b.credit_batch_id).single();
    if(batch) await db.from('credit_batches').update({ remaining: batch.remaining + 1 }).eq('id', b.credit_batch_id);
  }

  const m = data.members.find(x=>x.line_user_id===b.line_user_id);
  const newCredits = (m ? m.remaining_credits : 0) + 1;
  await db.from('members').update({ remaining_credits:newCredits }).eq('line_user_id', b.line_user_id);
  if(m) m.remaining_credits = newCredits;

  await openMemberDetail(b.line_user_id);
  showToast('已取消這筆預約，堂數已退還');
}

async function adjustMember(lineUserId, delta){
  const m = data.members.find(x=>x.line_user_id===lineUserId);
  if(!m) return;
  const newRemaining = Math.max(0, m.remaining_credits + delta);

  if(delta>0){
    const expiresAt = getRowExpiryInput(lineUserId); // 讀取這一列的效期欄位，留空＝永久有效
    await addCreditsToBatch(lineUserId, delta, expiresAt);
    const newTotal = (m.total_credits||0) + delta;
    await db.from('members').update({ remaining_credits:newRemaining, total_credits:newTotal }).eq('line_user_id', lineUserId);
    m.total_credits = newTotal;
  } else {
    await consumeCreditsFromBatches(lineUserId, -delta);
    await db.from('members').update({ remaining_credits:newRemaining }).eq('line_user_id', lineUserId);
  }
  m.remaining_credits = newRemaining;
  render();
  showToast(delta>0 ? '已加 1 堂' : '已扣 1 堂');
}

// 把一批預約紀錄依「實際場次」(class_key) 先彙總出每場的額滿率，
// 再依「課程」(標題＋老師＋時段，同一堂課的每一次上課都算同一組)
// 彙總出開課次數、累計參與人次、平均額滿率。用來給「老師教學紀錄」
// 跟「課程熱門度」共用，只是傳進來的預約紀錄範圍不同（單一老師 vs 全部）。
// 注意：統計只涵蓋「有過至少一筆預約」的場次，完全沒人訂的場次因為
// 資料庫裡不會留下任何紀錄，沒辦法算進去。
function summarizeClassPopularity(bookingsList){
  const sessions = {};
  bookingsList.forEach(b=>{
    if(!sessions[b.class_key]){
      sessions[b.class_key] = { title:b.class_title, teacher:b.teacher, time:b.class_time, cap:b.cap, active:0 };
    }
    if(b.status==='active') sessions[b.class_key].active++;
  });

  const groups = {};
  Object.values(sessions).forEach(s=>{
    const key = `${s.title}__${s.teacher}__${s.time}`;
    if(!groups[key]) groups[key] = { title:s.title, teacher:s.teacher, time:s.time, sessionsCount:0, totalActive:0, fillRateSum:0 };
    groups[key].sessionsCount++;
    groups[key].totalActive += s.active;
    groups[key].fillRateSum += (s.cap>0) ? (s.active / s.cap) : 0;
  });

  return Object.values(groups)
    .map(g=> ({ ...g, avgFillRate: g.sessionsCount>0 ? (g.fillRateSum / g.sessionsCount) : 0 }))
    .sort((a,b)=> b.avgFillRate - a.avgFillRate);
}

function pageTeacherLog(){
  const grouped = {};
  teacherLogData.forEach(b=>{
    const key = b.class_key;
    if(!grouped[key]) grouped[key] = { title:b.class_title, date:b.class_date, dateIso:b.class_date_iso, time:b.class_time, active:0, cancelled:0 };
    if(b.status==='active') grouped[key].active++; else grouped[key].cancelled++;
  });
  const allSessions = Object.values(grouped).sort((a,b)=> (a.date+a.time) < (b.date+b.time) ? 1 : -1);
  const totalStudents = allSessions.reduce((s,x)=>s+x.active, 0);

  const sessions = allSessions.filter(s=>{
    if(!s.dateIso) return true; // 沒有 iso 日期的舊資料，不篩選掉
    if(teacherLogFilterStart && s.dateIso < teacherLogFilterStart) return false;
    if(teacherLogFilterEnd && s.dateIso > teacherLogFilterEnd) return false;
    return true;
  });
  const hasLogFilter = teacherLogFilterStart || teacherLogFilterEnd;

  const rows = sessions.map(s=>`
    <tr>
      <td>${s.date} ${s.time}</td>
      <td>${s.title}</td>
      <td><b>${s.active}</b> 人${s.cancelled?`（另有 ${s.cancelled} 人取消）`:''}</td>
    </tr>`).join('');

  const popularityGroups = summarizeClassPopularity(teacherLogData);
  const popularityTotalPages = Math.max(1, Math.ceil(popularityGroups.length / TEACHER_LOG_POPULARITY_PAGE_SIZE));
  if(teacherLogPopularityPage > popularityTotalPages) teacherLogPopularityPage = popularityTotalPages;
  const popularityPageStart = (teacherLogPopularityPage - 1) * TEACHER_LOG_POPULARITY_PAGE_SIZE;
  const popularityRows = popularityGroups.slice(popularityPageStart, popularityPageStart + TEACHER_LOG_POPULARITY_PAGE_SIZE).map(g=>`
    <tr>
      <td>${g.title}</td>
      <td>${g.time}</td>
      <td>${g.sessionsCount}</td>
      <td>${g.totalActive}</td>
      <td><b>${(g.avgFillRate*100).toFixed(0)}%</b></td>
    </tr>`).join('');

  return `
    <div class="page-title">老師教學紀錄</div>
    <div class="page-sub">選擇老師，查看這位老師開過的每一堂課，以及每次上課有多少學員參與。</div>
    <div class="panel">
      <div class="panel-body">
        <div class="field" style="max-width:260px;">
          <label>選擇老師</label>
          <select onchange="onTeacherLogChange(this.value)">
            ${data.teachers.map(t=>`<option value="${t.name}" ${t.name===teacherLogSelected?'selected':''}>${t.name}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
    ${teacherLogSelected ? `
    <div class="stat-cards" style="grid-template-columns:repeat(2,1fr);">
      <div class="stat-card"><div class="num">${allSessions.length}</div><div class="lbl">總開課次數</div></div>
      <div class="stat-card"><div class="num">${totalStudents}</div><div class="lbl">累計參與學員人次</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>這位老師的課程熱門度</h3></div>
      <div class="panel-body pad0">
        <table><thead><tr><th>課程</th><th>時段</th><th>開課次數</th><th>累計參與人次</th><th>平均額滿率</th></tr></thead>
        <tbody>${popularityRows || '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px;">這位老師尚無開課紀錄</td></tr>'}</tbody></table>
      </div>
      <div class="panel-body" style="display:flex;align-items:center;justify-content:center;gap:12px;border-top:1px solid var(--line);">
        <button class="btn btn-ghost btn-sm" onclick="changeTeacherLogPopularityPage(-1)" ${teacherLogPopularityPage<=1?'disabled':''}>‹ 上一頁</button>
        <span style="font-size:12.5px;color:var(--muted);">第 ${teacherLogPopularityPage} / ${popularityTotalPages} 頁（共 ${popularityGroups.length} 堂課）</span>
        <button class="btn btn-ghost btn-sm" onclick="changeTeacherLogPopularityPage(1)" ${teacherLogPopularityPage>=popularityTotalPages?'disabled':''}>下一頁 ›</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>開課紀錄</h3></div>
      <div class="panel-body" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">
        <input type="date" id="tlFilterStart" value="${teacherLogFilterStart}" style="border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;">
        <span style="color:var(--muted);font-size:12px;">～</span>
        <input type="date" id="tlFilterEnd" value="${teacherLogFilterEnd}" style="border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;">
        <button class="btn btn-primary btn-sm" onclick="applyTeacherLogFilter()">套用</button>
        ${hasLogFilter ? `<button class="btn btn-ghost btn-sm" onclick="clearTeacherLogFilter()">清除篩選</button>` : ''}
        <span style="color:var(--muted);font-size:12px;">共 ${sessions.length} / ${allSessions.length} 場</span>
      </div>
      <div class="panel-body pad0" style="border-top:1px solid var(--line);">
        <table><thead><tr><th>上課時間</th><th>課程</th><th>參與人數</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:20px;">${allSessions.length===0 ? '這位老師尚無開課紀錄' : '這段區間內沒有開課紀錄'}</td></tr>`}</tbody></table>
      </div>
    </div>` : ''}`;
}

/* ================= 金流管理 ================= */
// 收入／支出都記在 transactions 這張表。「新增堂數」時填的實收金額會
// 自動連動產生一筆收入紀錄（credit_batch_id 指回那批堂數）；這個頁面
// 也可以直接手動新增任何一筆收入或支出（不用綁堂數），並且能編輯／刪除。
// 淨利＝收入－支出。
let cashflowRecords = null;
let cashflowFilterStart = '';
let cashflowFilterEnd = '';
let editingTransactionId = null;
let cashflowRankingPage = 1;
const CASHFLOW_RANKING_PAGE_SIZE = 10;

async function loadCashflowData(){
  const { data, error } = await db.from('transactions')
    .select('*').order('occurred_at', { ascending:false });
  cashflowRecords = (!error && data) ? data : [];
}
async function loadCashflowAndRender(){
  await loadCashflowData();
  render();
}
function applyCashflowFilter(){
  cashflowFilterStart = document.getElementById('cfFilterStart').value;
  cashflowFilterEnd = document.getElementById('cfFilterEnd').value;
  cashflowRankingPage = 1;
  render();
}
function clearCashflowFilter(){
  cashflowFilterStart = '';
  cashflowFilterEnd = '';
  cashflowRankingPage = 1;
  render();
}
function setCashflowThisMonth(){
  const now = new Date();
  cashflowFilterStart = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
  cashflowFilterEnd = todayISO(0);
  cashflowRankingPage = 1;
  render();
}
function changeCashflowRankingPage(delta){
  cashflowRankingPage = Math.max(1, cashflowRankingPage + delta);
  render();
}

function memberOptionsHtml(selectedUid){
  return `<option value="">（不指定學員）</option>` + data.members.map(m=>
    `<option value="${m.line_user_id}" ${selectedUid===m.line_user_id?'selected':''}>${m.display_name||'（未知學員）'}</option>`
  ).join('');
}
function memberMultiOptionsHtml(){
  return data.members.map(m=>
    `<option value="${m.line_user_id}">${m.display_name||'（未知學員）'}</option>`
  ).join('');
}

async function submitManualTransaction(){
  const type = document.getElementById('txType').value;
  const amount = Number(document.getElementById('txAmount').value);
  if(!amount || amount<=0){ showToast('請輸入正確的金額'); return; }
  const occurredAt = document.getElementById('txDate').value || todayISO(0);
  const selectedUids = [...document.getElementById('txMember').selectedOptions].map(o=>o.value);
  const note = document.getElementById('txNote').value.trim();

  if(selectedUids.length===0){
    await insertTransaction({ type, amount, note, lineUserId:null, occurredAt });
  } else {
    for(const lineUserId of selectedUids){
      await insertTransaction({ type, amount, note, lineUserId, occurredAt });
    }
  }
  await loadCashflowData();
  render();
  showToast(`已新增 ${Math.max(1, selectedUids.length)} 筆${type==='income'?'收入':'支出'}：每筆 NT$ ${amount.toLocaleString()}`);
}

function startEditTransaction(id){ editingTransactionId = id; render(); }
function cancelEditTransaction(){ editingTransactionId = null; render(); }

async function saveEditTransaction(id){
  const type = document.getElementById(`txEditType-${id}`).value;
  const amount = Number(document.getElementById(`txEditAmount-${id}`).value);
  if(!amount || amount<=0){ showToast('請輸入正確的金額'); return; }
  const occurredAt = document.getElementById(`txEditDate-${id}`).value;
  const lineUserId = document.getElementById(`txEditMember-${id}`).value || null;
  const note = document.getElementById(`txEditNote-${id}`).value.trim();

  const { error } = await db.from('transactions')
    .update({ type, amount, occurred_at: occurredAt, line_user_id: lineUserId, note })
    .eq('id', id);
  if(error){ showToast('更新失敗'); console.error(error); return; }

  editingTransactionId = null;
  await loadCashflowData();
  render();
  showToast('已更新這筆紀錄');
}

async function deleteTransactionRow(id){
  const ok = confirm('確定要刪除這筆金流紀錄嗎？這只會刪除這筆收支紀錄本身，不會動到相關的堂數或會員資料，無法復原。');
  if(!ok) return;
  const { error } = await db.from('transactions').delete().eq('id', id);
  if(error){ showToast('刪除失敗'); console.error(error); return; }
  await loadCashflowData();
  render();
  showToast('已刪除這筆紀錄');
}

function pageCashflow(){
  if(!cashflowRecords){
    return `<div class="page-title">金流管理</div><div class="page-sub">正在載入收支紀錄...</div>`;
  }
  const now = new Date();
  const thisMonthPrefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const sumByType = (list, type) => list.filter(r=>r.type===type).reduce((s,r)=> s + Number(r.amount), 0);

  const thisMonthRecords = cashflowRecords.filter(r => r.occurred_at.startsWith(thisMonthPrefix));
  const thisMonthIncome = sumByType(thisMonthRecords, 'income');
  const thisMonthExpense = sumByType(thisMonthRecords, 'expense');

  const filtered = cashflowRecords.filter(r=>{
    if(cashflowFilterStart && r.occurred_at < cashflowFilterStart) return false;
    if(cashflowFilterEnd && r.occurred_at > cashflowFilterEnd) return false;
    return true;
  });
  const filteredIncome = sumByType(filtered, 'income');
  const filteredExpense = sumByType(filtered, 'expense');
  const hasFilter = cashflowFilterStart || cashflowFilterEnd;

  const rows = filtered.map(r=>{
    const isEditing = editingTransactionId === r.id;
    if(isEditing){
      return `<tr>
        <td colspan="6">
          <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:end;padding:8px 0;">
            <div class="field" style="width:auto;"><label>類型</label>
              <select id="txEditType-${r.id}" style="width:90px;">
                <option value="income" ${r.type==='income'?'selected':''}>收入</option>
                <option value="expense" ${r.type==='expense'?'selected':''}>支出</option>
              </select>
            </div>
            <div class="field" style="width:auto;"><label>日期</label><input id="txEditDate-${r.id}" type="date" value="${r.occurred_at}"></div>
            <div class="field" style="width:auto;"><label>金額</label><input id="txEditAmount-${r.id}" type="number" min="0" value="${r.amount}" style="width:100px;"></div>
            <div class="field" style="width:auto;"><label>學員（選填）</label><select id="txEditMember-${r.id}">${memberOptionsHtml(r.line_user_id)}</select></div>
            <div class="field" style="width:auto;"><label>備註</label><input id="txEditNote-${r.id}" value="${r.note||''}" style="width:160px;"></div>
            <button class="btn btn-ghost btn-sm" onclick="cancelEditTransaction()">取消</button>
            <button class="btn btn-primary btn-sm" onclick="runCreditAction(()=>saveEditTransaction('${r.id}'))">儲存</button>
          </div>
        </td>
      </tr>`;
    }
    return `
    <tr>
      <td>${r.occurred_at}</td>
      <td><span class="tag ${r.type==='income'?'on':'off'}">${r.type==='income'?'收入':'支出'}</span></td>
      <td>${r.line_user_id ? memberName(r.line_user_id) : '—'}</td>
      <td style="color:${r.type==='income'?'var(--sage-dark)':'var(--danger)'};font-weight:700;">${r.type==='income'?'+':'－'}NT$ ${Number(r.amount).toLocaleString()}</td>
      <td>${r.note || '—'}</td>
      <td><div class="row-actions">
        <button class="btn btn-ghost btn-sm" onclick="startEditTransaction('${r.id}')">編輯</button>
        <button class="btn btn-danger btn-sm" onclick="runCreditAction(()=>deleteTransactionRow('${r.id}'))">刪除</button>
      </div></td>
    </tr>`;
  }).join('');

  // 依學員彙總「收入」總額（依篩選區間），由高到低排序，每頁 10 名
  const byMember = {};
  filtered.filter(r=>r.type==='income' && r.line_user_id).forEach(r=>{
    byMember[r.line_user_id] = (byMember[r.line_user_id]||0) + Number(r.amount);
  });
  const rankingList = Object.entries(byMember).sort((a,b)=> b[1]-a[1]);
  const rankingTotalPages = Math.max(1, Math.ceil(rankingList.length / CASHFLOW_RANKING_PAGE_SIZE));
  if(cashflowRankingPage > rankingTotalPages) cashflowRankingPage = rankingTotalPages;
  const rankingStart = (cashflowRankingPage - 1) * CASHFLOW_RANKING_PAGE_SIZE;
  const rankingPageItems = rankingList.slice(rankingStart, rankingStart + CASHFLOW_RANKING_PAGE_SIZE);
  const memberRanking = rankingPageItems
    .map(([uid, total], i)=> `<tr><td>${rankingStart + i + 1}</td><td>${memberName(uid)}</td><td>NT$ ${total.toLocaleString()}</td></tr>`).join('');

  return `
    <div class="page-title">金流管理</div>
    <div class="page-sub">收入／支出都可以在下面手動新增，或是在學員的「新增堂數」順便填實收金額自動產生一筆收入。淨利＝收入－支出。</div>

    <div class="stat-cards">
      <div class="stat-card"><div class="num">NT$ ${thisMonthIncome.toLocaleString()}</div><div class="lbl">本月收入</div></div>
      <div class="stat-card"><div class="num">NT$ ${thisMonthExpense.toLocaleString()}</div><div class="lbl">本月支出</div></div>
      <div class="stat-card"><div class="num">NT$ ${(thisMonthIncome-thisMonthExpense).toLocaleString()}</div><div class="lbl">本月淨利</div></div>
      <div class="stat-card"><div class="num">NT$ ${(filteredIncome-filteredExpense).toLocaleString()}</div><div class="lbl">${hasFilter ? '篩選區間淨利' : '全部總淨利'}</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch;">
      <div class="panel" style="display:flex;flex-direction:column;">
        <div class="panel-head"><h3>手動新增一筆收入／支出</h3></div>
        <div class="panel-body">
          <div class="form-grid">
            <div class="field"><label>類型</label>
              <select id="txType">
                <option value="income">收入</option>
                <option value="expense">支出</option>
              </select>
            </div>
            <div class="field"><label>金額（NT$）</label><input id="txAmount" type="number" min="0" placeholder="例如：3000"></div>
            <div class="field"><label>日期</label><input id="txDate" type="date" value="${todayISO(0)}"></div>
            <div class="field" style="grid-column:1/-1;">
              <label>學員（選填，可多選，通常收入才會指定；按住 Cmd／Ctrl 可複選）</label>
              <select id="txMember" multiple size="5" style="height:auto;">${memberMultiOptionsHtml()}</select>
              <div class="desc" style="margin-top:4px;">選多位學員的話，每人各記一筆一樣金額的紀錄；不選就是不指定學員的一筆。</div>
            </div>
            <div class="field" style="grid-column:1/-1;"><label>備註</label><input id="txNote" placeholder="例如：場地租金、教材採購、10堂課程"></div>
          </div>
        </div>
        <div class="add-bar" style="margin-top:auto;"><button class="btn btn-primary" onclick="runCreditAction(submitManualTransaction)">＋ 新增這筆</button></div>
      </div>

      <div class="panel" style="display:flex;flex-direction:column;">
        <div class="panel-head"><h3>依學員排序的消費總額${hasFilter ? '（篩選區間）' : ''}</h3></div>
        <div class="panel-body pad0">
          <table><thead><tr><th>#</th><th>學員</th><th>消費總額</th></tr></thead>
          <tbody>${memberRanking || '<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:20px;">尚無資料</td></tr>'}</tbody></table>
        </div>
        <div class="panel-body" style="margin-top:auto;display:flex;align-items:center;justify-content:center;gap:12px;border-top:1px solid var(--line);">
          <button class="btn btn-ghost btn-sm" onclick="changeCashflowRankingPage(-1)" ${cashflowRankingPage<=1?'disabled':''}>‹ 上一頁</button>
          <span style="font-size:12.5px;color:var(--muted);">第 ${cashflowRankingPage} / ${rankingTotalPages} 頁（共 ${rankingList.length} 位）</span>
          <button class="btn btn-ghost btn-sm" onclick="changeCashflowRankingPage(1)" ${cashflowRankingPage>=rankingTotalPages?'disabled':''}>下一頁 ›</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>收支紀錄</h3>
        <button class="btn btn-ghost btn-sm" onclick="runCreditAction(loadCashflowAndRender)">🔄 重新整理</button>
      </div>
      <div class="panel-body" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">
        <input type="date" id="cfFilterStart" value="${cashflowFilterStart}" style="border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;">
        <span style="color:var(--muted);font-size:12px;">～</span>
        <input type="date" id="cfFilterEnd" value="${cashflowFilterEnd}" style="border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;">
        <button class="btn btn-primary btn-sm" onclick="applyCashflowFilter()">套用</button>
        <button class="btn btn-ghost btn-sm" onclick="setCashflowThisMonth()">本月</button>
        ${hasFilter ? `<button class="btn btn-ghost btn-sm" onclick="clearCashflowFilter()">清除篩選</button>` : ''}
      </div>
      <div class="panel-body pad0" style="border-top:1px solid var(--line);">
        <table><thead><tr><th>日期</th><th>類型</th><th>學員</th><th>金額</th><th>備註</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px;">${cashflowRecords.length===0 ? '尚無收支紀錄' : '這段區間內沒有收支紀錄'}</td></tr>`}</tbody></table>
      </div>
    </div>`;
}
