/* ================= 報名表單設定（會員註冊） ================= */
// 表單啟用狀態存在 store_settings.registration_form_status（跟店家設定同一列）。
// 'draft' = 前台不會出現任何表單／入口，可以放心慢慢設計問題；
// 'published' = 新學員打開前台會直接看到表單，已註冊學員會看到「會員資料設定」入口。
async function saveRegistrationDraft(){
  const { error } = await db.from('store_settings').update({ registration_form_status: 'draft' }).eq('id', 1);
  if(error){ showToast('儲存失敗'); console.error(error); return; }
  data.store.registration_form_status = 'draft';
  render();
  showToast('已儲存草稿，表單還沒啟用，前台不會出現');
}
async function publishRegistrationForm(){
  if(registrationQuestions.filter(q=>q.active).length===0){
    if(!confirm('目前沒有任何啟用中的問題（只會收姓名跟 e-mail），確定要這樣送出啟用嗎？')) return;
  }
  if(!confirm('確定要啟用這份表單嗎？啟用後，前台的新學員打開 app 就會直接看到這份表單。')) return;
  const { error } = await db.from('store_settings').update({ registration_form_status: 'published' }).eq('id', 1);
  if(error){ showToast('啟用失敗'); console.error(error); return; }
  data.store.registration_form_status = 'published';
  render();
  showToast('已啟用，前台生效中');
}
async function unpublishRegistrationForm(){
  if(!confirm('確定要停用這份表單嗎？停用後前台不會再跳出表單，改回草稿狀態。')) return;
  const { error } = await db.from('store_settings').update({ registration_form_status: 'draft' }).eq('id', 1);
  if(error){ showToast('停用失敗'); console.error(error); return; }
  data.store.registration_form_status = 'draft';
  render();
  showToast('已停用，改回草稿狀態');
}

function onNewRegQTypeChange(){
  document.getElementById('newRegQOptionsField').style.display =
    document.getElementById('newRegQType').value==='choice' ? 'block' : 'none';
}
function addNewRegQOption(){
  const input = document.getElementById('newRegQOptionInput');
  const val = input.value.trim();
  if(!val) return;
  newRegQOptions.push(val);
  input.value = '';
  renderNewRegQOptions();
}
function removeNewRegQOption(i){
  newRegQOptions.splice(i,1);
  renderNewRegQOptions();
}
function renderNewRegQOptions(){
  const el = document.getElementById('newRegQOptionsList');
  if(!el) return;
  el.innerHTML = newRegQOptions.map((o,i)=>
    `<span class="tag-chip">${o}<span class="x" onclick="removeNewRegQOption(${i})">✕</span></span>`
  ).join('') || '<span style="color:var(--muted);font-size:12px;">尚未新增選項</span>';
}
async function submitNewRegQuestion(){
  const text = document.getElementById('newRegQText').value.trim();
  const type = document.getElementById('newRegQType').value;
  const required = document.getElementById('newRegQRequired').checked;
  if(!text){ showToast('請輸入問題文字'); return; }
  if(type==='choice' && newRegQOptions.length<2){ showToast('單選題至少要有 2 個選項'); return; }
  const sortOrder = registrationQuestions.length>0 ? Math.max(...registrationQuestions.map(q=>q.sort_order)) + 1 : 0;
  const { error } = await db.from('registration_questions').insert({
    question: text, type, options: type==='choice' ? [...newRegQOptions] : [], sort_order: sortOrder, active: true, required
  });
  if(error){ showToast('新增失敗'); console.error(error); return; }
  document.getElementById('newRegQText').value = '';
  document.getElementById('newRegQRequired').checked = false;
  newRegQOptions = [];
  await loadAdminState();
  render();
  showToast('已新增問題');
}
async function toggleRegQuestionActive(id){
  const q = registrationQuestions.find(x=>x.id===id);
  if(!q) return;
  const { error } = await db.from('registration_questions').update({ active: !q.active }).eq('id', id);
  if(error){ showToast('更新失敗'); console.error(error); return; }
  q.active = !q.active;
  render();
}
async function toggleRegQuestionRequired(id){
  const q = registrationQuestions.find(x=>x.id===id);
  if(!q) return;
  const { error } = await db.from('registration_questions').update({ required: !q.required }).eq('id', id);
  if(error){ showToast('更新失敗'); console.error(error); return; }
  q.required = !q.required;
  render();
}
async function deleteRegQuestion(id){
  if(!confirm('確定要刪除這個問題嗎？已經收到的答案不會被刪除，只是表單上不會再顯示這一題。')) return;
  const { error } = await db.from('registration_questions').delete().eq('id', id);
  if(error){ showToast('刪除失敗'); console.error(error); return; }
  registrationQuestions = registrationQuestions.filter(x=>x.id!==id);
  render();
  showToast('已刪除');
}
async function moveRegQuestion(id, delta){
  const idx = registrationQuestions.findIndex(x=>x.id===id);
  const newIdx = idx + delta;
  if(newIdx<0 || newIdx>=registrationQuestions.length) return;
  const a = registrationQuestions[idx], b = registrationQuestions[newIdx];
  [registrationQuestions[idx], registrationQuestions[newIdx]] = [b, a];
  await Promise.all([
    db.from('registration_questions').update({ sort_order: b.sort_order }).eq('id', a.id),
    db.from('registration_questions').update({ sort_order: a.sort_order }).eq('id', b.id)
  ]);
  const tmp = a.sort_order; a.sort_order = b.sort_order; b.sort_order = tmp;
  render();
}
function startEditRegQuestion(id){ editingRegQuestionId = id; render(); }
function cancelEditRegQuestion(){ editingRegQuestionId = null; render(); }
async function saveEditRegQuestion(id){
  const text = document.getElementById(`rqEditText-${id}`).value.trim();
  if(!text){ showToast('問題文字不能空白'); return; }
  const { error } = await db.from('registration_questions').update({ question: text }).eq('id', id);
  if(error){ showToast('更新失敗'); console.error(error); return; }
  const q = registrationQuestions.find(x=>x.id===id);
  if(q) q.question = text;
  editingRegQuestionId = null;
  render();
  showToast('已更新問題');
}

async function toggleRegistrationShowName(){
  const newVal = !(data.store.registration_show_name!==false);
  const { error } = await db.from('store_settings').update({ registration_show_name: newVal }).eq('id', 1);
  if(error){ showToast('更新失敗'); console.error(error); return; }
  data.store.registration_show_name = newVal;
  render();
}
async function toggleRegistrationShowContact(){
  const newVal = !(data.store.registration_show_contact!==false);
  const { error } = await db.from('store_settings').update({ registration_show_contact: newVal }).eq('id', 1);
  if(error){ showToast('更新失敗'); console.error(error); return; }
  data.store.registration_show_contact = newVal;
  render();
}

function pageRegistration(){
  const isPublished = data.store.registration_form_status==='published';
  const rows = registrationQuestions.map((q,i)=>{
    const isEditing = editingRegQuestionId===q.id;
    if(isEditing){
      return `
      <div class="q-row" style="align-items:end;">
        <div class="field" style="flex:1;"><label>問題文字</label><input id="rqEditText-${q.id}" value="${q.question}"></div>
        <button class="btn btn-ghost btn-sm" onclick="cancelEditRegQuestion()">取消</button>
        <button class="btn btn-primary btn-sm" onclick="saveEditRegQuestion('${q.id}')">儲存</button>
      </div>`;
    }
    return `
      <div class="q-row">
        <div class="q-order">
          <button onclick="moveRegQuestion('${q.id}',-1)" ${i===0?'disabled':''}>▲</button>
          <button onclick="moveRegQuestion('${q.id}',1)" ${i===registrationQuestions.length-1?'disabled':''}>▼</button>
        </div>
        <div class="q-main">
          <div class="q-text">${q.question}</div>
          <div class="q-meta">
            <span class="tag ${q.type==='choice'?'on':'off'}">${q.type==='choice' ? '單選：'+(q.options||[]).join('、') : '簡答'}</span>
            <span class="tag ${q.active?'on':'off'}" style="margin-left:6px;">${q.active?'顯示中':'已隱藏'}</span>
            <span class="tag ${q.required?'warn':'off'}" style="margin-left:6px;">${q.required?'必填':'選填'}</span>
          </div>
        </div>
        <div class="q-actions">
          <label style="display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);cursor:pointer;white-space:nowrap;" title="必填">
            <div class="toggle ${q.required?'on':''}" onclick="toggleRegQuestionRequired('${q.id}')"><div class="knob"></div></div>必填
          </label>
          <div class="toggle ${q.active?'on':''}" onclick="toggleRegQuestionActive('${q.id}')" title="顯示／隱藏"><div class="knob"></div></div>
          <button class="btn btn-ghost btn-sm" onclick="startEditRegQuestion('${q.id}')">編輯</button>
          <button class="btn btn-danger btn-sm" onclick="deleteRegQuestion('${q.id}')">刪除</button>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="page-title">報名表單設定</div>
    <div class="page-sub">設定「會員註冊」表單要收集的問題。啟用後，新學員第一次打開前台會直接看到這份表單；已註冊學員可以隨時從「會員資料設定」查看或修改自己填過的答案。每位學員填過的答案，會顯示在「學員管理 → 查看／管理」裡。</div>

    <div class="panel" style="border-color:${isPublished?'var(--sage)':'var(--clay)'};">
      <div class="panel-body" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="tag ${isPublished?'on':'off'}" style="font-size:12.5px;padding:5px 12px;">${isPublished ? '✅ 已啟用' : '📝 草稿（尚未啟用）'}</span>
          <span style="font-size:12.5px;color:var(--muted);">${isPublished ? '前台的新學員打開 app 時，會直接看到這份表單。' : '前台不會出現這份表單，你可以放心慢慢設計問題。'}</span>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost btn-sm" onclick="saveRegistrationDraft()">💾 儲存草稿</button>
          ${isPublished
            ? `<button class="btn btn-danger btn-sm" onclick="unpublishRegistrationForm()">停用</button>`
            : `<button class="btn btn-primary btn-sm" onclick="publishRegistrationForm()">✅ 確認送出並啟用</button>`
          }
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>固定欄位</h3></div>
      <div class="panel-body">
        <div class="desc" style="margin-bottom:12px;">「姓名」「e-mail」原本是表單一定會有的固定欄位。如果你已經自己設計了對應的問題（例如下面的自訂問題也叫「姓名」），可以把這裡關掉，避免重複。</div>
        <div class="settings-row">
          <div><div class="label">顯示「姓名」固定欄位</div></div>
          <div class="toggle ${data.store.registration_show_name!==false?'on':''}" onclick="toggleRegistrationShowName()"><div class="knob"></div></div>
        </div>
        <div class="settings-row">
          <div><div class="label">顯示「e-mail」固定欄位</div></div>
          <div class="toggle ${data.store.registration_show_contact!==false?'on':''}" onclick="toggleRegistrationShowContact()"><div class="knob"></div></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>新增問題</h3></div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="field" style="grid-column:1/-1;"><label>問題文字</label><input id="newRegQText" placeholder="例如：有沒有瑜珈經驗？"></div>
          <div class="field"><label>題型</label>
            <select id="newRegQType" onchange="onNewRegQTypeChange()">
              <option value="text">簡答（自由輸入文字）</option>
              <option value="choice">單選（自己設定選項）</option>
            </select>
          </div>
          <div class="field" id="newRegQOptionsField" style="display:none;grid-column:1/-1;">
            <label>選項</label>
            <div class="tag-add-row">
              <input id="newRegQOptionInput" placeholder="輸入一個選項後按新增">
              <button class="tag-add-btn" onclick="addNewRegQOption()" type="button">＋</button>
            </div>
            <div id="newRegQOptionsList" class="tag-chip-wrap"></div>
          </div>
          <div class="field" style="grid-column:1/-1;flex-direction:row;align-items:center;gap:8px;">
            <input type="checkbox" id="newRegQRequired" style="width:16px;height:16px;">
            <label for="newRegQRequired" style="margin:0;">這一題設為必填</label>
          </div>
        </div>
      </div>
      <div class="add-bar"><button class="btn btn-primary" onclick="submitNewRegQuestion()">＋ 新增這個問題</button></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>目前的問題（照這個順序顯示在表單上）</h3></div>
      <div class="panel-body pad0">${rows || '<div class="empty-state" style="padding:24px;color:var(--muted);text-align:center;">目前沒有任何問題，上面新增一個看看吧</div>'}</div>
    </div>`;
}

const PAGES = {overview:pageOverview, store:pageStore, cashflow:pageCashflow, classes:pageClasses, teachers:pageTeachers, members:pageMembers, roster:pageRoster, teacherlog:pageTeacherLog, popularity:pagePopularity, registration:pageRegistration};

function render(){
  document.getElementById('sidebarBrand').innerHTML = data.store.name + '<span>後台管理系統</span>';
  document.getElementById('mainArea').innerHTML = PAGES[currentPage]();
}

const CURRENT_PAGE_KEY = 'admin-current-page-v1';

async function navigateToPage(page){
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  const targetItem = document.querySelector(`.nav-item[data-page="${page}"]`);
  if(targetItem) targetItem.classList.add('active');
  currentPage = page;
  localStorage.setItem(CURRENT_PAGE_KEY, page); // 記住目前頁面，重新整理後可以回到同一頁
  selectedMemberId = null; memberBookings = [];
  editingClassId = null;
  if(page==='classes'){ await loadDayOverrides(); }
  if(page==='members'){ await loadMemberStats(); await loadDayOverrides(); }
  if(page==='roster'){ await loadRoster(); }
  if(page==='teacherlog'){ await loadTeacherLog(teacherLogSelected || (data.teachers[0] && data.teachers[0].name) || ''); }
  if(page==='cashflow'){ await loadCashflowData(); }
  if(page==='popularity'){ await loadPopularityData(); }
  render();
}

document.querySelectorAll('.nav-item').forEach(item=>{
  item.addEventListener('click', ()=>{ navigateToPage(item.dataset.page); });
});

const SESSION_KEY = 'admin-logged-in-v1';

function tryLogin(){
  const input = document.getElementById('loginPassword');
  const err = document.getElementById('loginErr');
  const correctPw = data.store.admin_password || 'class1234';
  if(input.value === correctPw){
    localStorage.setItem(SESSION_KEY, '1'); // 記住這台裝置已登入，重新整理不用再輸入密碼
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    render();
  } else {
    err.textContent = '密碼錯誤，請再試一次';
    input.value = '';
    input.focus();
  }
}
function logout(){
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(CURRENT_PAGE_KEY);
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginErr').textContent = '';
  showLoginBox();
}

/* ---- 忘記密碼流程 ---- */
function showForgotBox(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('forgotBox').style.display = 'block';
  document.getElementById('forgotStep1').style.display = 'block';
  document.getElementById('forgotStep2').style.display = 'none';
  document.getElementById('securityQuestionText').textContent = data.store.security_question || '（尚未設定安全問題，請聯繫系統開發者協助重設）';
  document.getElementById('securityAnswerInput').value = '';
  document.getElementById('forgotErr1').textContent = '';
}
function showLoginBox(){
  document.getElementById('forgotBox').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginErr').textContent = '';
}
function verifySecurityAnswer(){
  const ans = document.getElementById('securityAnswerInput').value.trim();
  const correct = (data.store.security_answer || '').trim();
  const err = document.getElementById('forgotErr1');
  if(!correct){ err.textContent = '尚未設定安全問題答案，無法透過此方式重設，請直接到 Supabase 後台修改 store_settings 資料表。'; return; }
  if(ans.toLowerCase() !== correct.toLowerCase()){
    err.textContent = '答案不正確，請再試一次';
    return;
  }
  document.getElementById('forgotStep1').style.display = 'none';
  document.getElementById('forgotStep2').style.display = 'block';
}
async function resetPasswordViaForgot(){
  const pw1 = document.getElementById('newPwInput').value;
  const pw2 = document.getElementById('newPwInput2').value;
  const err = document.getElementById('forgotErr2');
  if(pw1.length<6){ err.textContent = '密碼至少要 6 碼'; return; }
  if(pw1!==pw2){ err.textContent = '兩次輸入的密碼不一致'; return; }
  const { error } = await db.from('store_settings').update({ admin_password: pw1 }).eq('id', 1);
  if(error){ err.textContent = '重設失敗，請稍後再試'; console.error(error); return; }
  data.store.admin_password = pw1;
  showToast('密碼已重設，請用新密碼登入');
  showLoginBox();
}

(async function init(){
  try{
    await loadAdminState();
    applyTheme(data.store.theme || 'sage');
  }catch(e){
    console.error('讀取資料庫失敗，請確認 Supabase 資料表是否已建立：', e);
  }

  document.getElementById('bootLoading').style.display = 'none';

  if(localStorage.getItem(SESSION_KEY) === '1'){
    // 這台裝置先前登入過，不用再輸入密碼，直接進畫面
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    const savedPage = localStorage.getItem(CURRENT_PAGE_KEY) || 'overview';
    await navigateToPage(savedPage); // 回到重新整理前所在的那一頁
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginPassword').focus();
  }
})();
</script>
